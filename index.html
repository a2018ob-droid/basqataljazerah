<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب عميل - باسقات الجزيرة</title>
    <style>
        body { font-family: sans-serif; background: #fff; margin: 0; padding: 5px; font-size: 13px; }
        .page { max-width: 600px; margin: auto; padding: 10px; border: 1px solid #ccc; }
        .header { text-align: center; border-bottom: 2px solid #8c7b5a; padding-bottom: 5px; }
        .header img { max-width: 80px; }
        .header h2 { margin: 5px 0; font-size: 16px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; font-size: 11px; margin-bottom: 2px; }
        input[type="text"], textarea { padding: 5px; border: 1px solid #999; width: 100%; box-sizing: border-box; }
        
        .date-input-wrapper { position: relative; }
        .date-input-wrapper input[type="date"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .section { font-weight: bold; border-right: 4px solid #8c7b5a; padding: 3px 6px; background: #f9f9f9; margin: 10px 0; font-size: 12px; }
        .img-box { display: flex; gap: 5px; min-height: 50px; flex-wrap: wrap; }
        .img-box img { width: 50px; height: 50px; object-fit: cover; border: 1px solid #ccc; }
        
        .check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-top: 2px; }
        .checkbox-box { padding: 5px; border: 1px solid #999; display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 11px; font-weight: bold; background: #f5f5f5; }
        .checkbox-box input { margin: 0; width: auto; }
        
        .payment-row { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        .signature-area { margin-top: 20px; display: flex; justify-content: space-between; border-top: 1px solid #000; padding-top: 10px; font-weight: bold; }
        
        .btn-print { width: 100%; padding: 10px; background: #8c7b5a; color: #fff; border: none; margin-top: 15px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<div class="page">
    <div class="header">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
        <h2>طلب العميل</h2>
        <p style="font-size: 11px; color: #8c7b5a; margin-top: 3px;">باسقات الجزيرة للتمور والحلويات</p>
    </div>

    <div class="grid">
        <div class="form-group"><label>تاريخ اليوم:</label><input type="text" id="today-date" readonly></div>
        <div class="form-group">
            <label>تاريخ الاستلام:</label>
            <div class="date-input-wrapper">
                <input type="text" id="delivery-date-display" placeholder="اختر التاريخ..." readonly style="background:#f5f5f5;">
                <input type="date" class="no-print" onchange="updateDeliveryDate(this.value)">
            </div>
        </div>
        <div class="form-group"><label>اسم العميل:</label><input type="text" id="customerName"></div>
        <div class="form-group">
            <label>الجوال:</label>
            <input type="tel" id="customerPhone" maxlength="10" placeholder="05xxxxxxxx">
        </div>
    </div>

    <div class="section">الصواني</div>
    <input type="file" accept="image/*" id="tray-upload" class="no-print" multiple>
    <div class="img-box" id="tray-preview"></div>

    <div class="section">الأصناف (صور)</div>
    <input type="file" accept="image/*" id="items-upload" class="no-print" multiple>
    <div class="img-box" id="items-preview"></div>

    <div class="section">الأصناف (كتابياً)</div>
    <textarea rows="3" id="itemsText"></textarea>

    <div class="section">الملاحظات</div>
    <textarea rows="2" id="notes"></textarea>

    <div class="grid">
        <div class="form-group"><label>الموظف المسؤول:</label><input type="text" id="employeeName"></div>
        <div class="form-group"><label style="color: #8c7b5a;">طريقة الاستلام:</label>
            <div class="check-grid">
                <label class="checkbox-box" onclick="selectDelivery(this, 'store')">
                    <input type="radio" name="delivery" class="no-print"> استلام بالمعرض
                </label>
                <label class="checkbox-box" onclick="selectDelivery(this, 'delivery')">
                    <input type="radio" name="delivery" class="no-print"> توصيل
                </label>
            </div>
        </div>
    </div>

    <div class="section">عملية الدفع</div>
    <div class="check-grid">
        <label class="checkbox-box" onclick="selectPayment(this, 'full')">
            <input type="radio" name="pay" class="no-print"> كامل المبلغ
        </label>
        <label class="checkbox-box" onclick="selectPayment(this, 'partial')">
            <input type="radio" name="pay" class="no-print"> جزء من المبلغ
        </label>
    </div>
    <div id="rem-box" class="payment-row" style="display:none;">
        <label style="color: #8c7b5a; font-size: 11px;">المتبقي:</label>
        <input type="text" id="remainingAmount" placeholder="المبلغ المتبقي">
    </div>

    <div class="signature-area">
        <span>توقيع العميل: ..........................</span>
    </div>

    <button class="btn-print no-print" onclick="window.print()">🖨️ طباعة النموذج</button>
</div>

<script>
    // التاريخ
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('today-date').value = new Date().toLocaleDateString('ar-SA', options);
    
    function updateDeliveryDate(val) {
        if (!val) return;
        const date = new Date(val);
        document.getElementById('delivery-date-display').value = date.toLocaleDateString('ar-SA', options);
    }
    
    // رفع الصور
    function setupCamera(inputId, previewId) {
        document.getElementById(inputId).addEventListener('change', function(e) {
            const preview = document.getElementById(previewId);
            const files = e.target.files;
            for(let i=0; i<files.length; i++) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    preview.appendChild(img);
                }
                reader.readAsDataURL(files[i]);
            }
        });
    }
    setupCamera('tray-upload', 'tray-preview');
    setupCamera('items-upload', 'items-preview');
    
    // اختيارات الاستلام
    function selectDelivery(element, type) {
        const allBoxes = document.querySelectorAll('.checkbox-box');
        allBoxes.forEach(box => {
            box.style.backgroundColor = '#f5f5f5';
            box.style.color = 'black';
        });
        element.style.backgroundColor = type === 'store' ? '#e8f5e9' : '#ffebee';
        element.style.color = type === 'store' ? 'green' : 'red';
    }
    
    // اختيارات الدفع
    function selectPayment(element, type) {
        const allBoxes = document.querySelectorAll('.check-grid .checkbox-box');
        allBoxes.forEach(box => {
            box.style.backgroundColor = '#f5f5f5';
            box.style.color = 'black';
        });
        element.style.backgroundColor = type === 'full' ? '#e8f5e9' : '#ffebee';
        element.style.color = type === 'full' ? 'green' : 'red';
        
        const remBox = document.getElementById('rem-box');
        remBox.style.display = type === 'partial' ? 'flex' : 'none';
    }
</script>
</body>
</html>
