<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>طلب عميل - باسقات الجزيرة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e0e0e0;
            font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            max-width: 210mm;
            width: 100%;
            background: white;
            margin: 0 auto;
            padding: 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            border-radius: 4px;
        }

        .page-content {
            padding: 0.3cm;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
            margin-bottom: 8px;
        }

        .logo-area {
            margin-bottom: 3px;
        }

        .logo-img {
            max-width: 60px;
            max-height: 60px;
            object-fit: contain;
        }

        .header h2 {
            font-size: 18px;
            color: #333;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 0.2cm;
        }

        label {
            font-weight: bold;
            font-size: 11px;
            margin-bottom: 3px;
            color: #333;
        }

        input, textarea {
            padding: 6px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font-size: 12px;
            font-family: inherit;
            width: 100%;
            box-sizing: border-box;
            background: white;
        }

        input[readonly] {
            background-color: #f9f9f9;
        }

        .date-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .date-wrapper input[type="text"] {
            width: 100%;
            padding-left: 35px;
        }

        .date-wrapper input[type="date"] {
            position: absolute;
            left: 0;
            top: 0;
            width: 35px;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .calendar-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 14px;
        }

        .section {
            font-weight: bold;
            border-right: 3px solid #999;
            padding: 4px 8px;
            background: #f5f5f5;
            margin: 10px 0 6px 0;
            font-size: 13px;
            border-radius: 0 4px 4px 0;
        }

        .img-box {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            min-height: 80px;
            border: 1px dashed #aaa;
            padding: 8px;
            border-radius: 4px;
            background: #fefefe;
        }

        .img-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .delete-img {
            position: absolute;
            top: -6px;
            right: -6px;
            background: red;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .check-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 3px;
        }

        .checkbox-box {
            padding: 5px;
            border: 1px solid #aaa;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: normal;
            background: white;
        }

        .checkbox-box input {
            width: 14px;
            height: 14px;
            margin: 0;
        }

        /* باركود - تصميم مضغوط */
        .wa-box {
            display: none;
            text-align: center;
            margin-top: 5px;
            padding: 4px;
            background: #f0f0f0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .wa-box span {
            font-size: 9px;
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 3px;
        }

        .wa-box img {
            width: 50px;
            height: 50px;
            margin: 0 auto;
        }

        .payment-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }

        .signature-area {
            margin-top: 12px;
            border-top: 1px solid #000;
            padding-top: 8px;
            font-weight: bold;
            font-size: 12px;
        }

        .btn-print {
            width: 100%;
            padding: 8px;
            background: #555;
            color: white;
            border: none;
            margin-top: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .page-content {
                padding: 0.2cm;
            }
            .grid {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .img-wrapper {
                width: 80px;
                height: 80px;
            }
            .delete-img {
                width: 18px;
                height: 18px;
                font-size: 10px;
                top: -5px;
                right: -5px;
            }
        }

        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .page {
                padding: 0;
                margin: 0;
                box-shadow: none;
                max-width: 100%;
                page-break-after: avoid;
                page-break-inside: avoid;
            }
            .page-content {
                padding: 0.2cm;
            }
            .no-print {
                display: none !important;
            }
            .delete-img {
                display: none !important;
            }
            .img-wrapper {
                width: 90px;
                height: 90px;
            }
            .checkbox-box {
                border: 1px solid #000;
                background: transparent !important;
            }
            .btn-print {
                display: none;
            }
            .date-wrapper input[type="date"] {
                display: none;
            }
            .calendar-icon {
                display: none;
            }
            .wa-box {
                background: transparent;
                border: 1px solid #aaa;
            }
            @page {
                margin: 0.2cm;
                size: A4;
            }
        }
    </style>
</head>
<body>

<div class="page">
    <div class="page-content">
        <div class="header">
            <div class="logo-area">
                <img src="logo.png" alt="شعار الشركة" class="logo-img" onerror="this.style.display='none'">
            </div>
            <h2>طلب العميل</h2>
        </div>

        <div class="grid">
            <div class="form-group">
                <label>📅 تاريخ اليوم:</label>
                <input type="text" id="todayDate" readonly>
            </div>
            <div class="form-group">
                <label>📦 تاريخ الاستلام:</label>
                <div class="date-wrapper">
                    <input type="text" id="deliveryDateDisplay" readonly placeholder="اختر التاريخ">
                    <input type="date" id="deliveryDatePicker" class="no-print">
                    <span class="calendar-icon">📅</span>
                </div>
            </div>
            <div class="form-group">
                <label>👤 اسم العميل:</label>
                <input type="text" id="customerName" placeholder="الاسم الكامل">
            </div>
            <div class="form-group">
                <label>📱 الجوال:</label>
                <input type="tel" id="customerPhone" maxlength="10" placeholder="05xxxxxxxx">
                <div class="wa-box" id="waContainer">
                    <span>📱 باركود واتساب</span>
                    <img id="waQR" alt="QR Code">
                </div>
            </div>
        </div>

        <div class="section">🥘 الصواني</div>
        <input type="file" accept="image/*" id="trayUpload" class="no-print" multiple>
        <div class="img-box" id="trayPreview"></div>

        <div class="section">🍽️ الأصناف (صور)</div>
        <input type="file" accept="image/*" id="itemsUpload" class="no-print" multiple>
        <div class="img-box" id="itemsPreview"></div>

        <div class="section">📝 الأصناف (كتابياً)</div>
        <textarea rows="2" id="itemsText" placeholder="اكتب الأصناف المطلوبة..."></textarea>

        <div class="section">📌 الملاحظات</div>
        <textarea rows="2" id="notes" placeholder="أي ملاحظات إضافية..."></textarea>

        <div class="grid">
            <div class="form-group">
                <label>👨‍💼 الموظف المسؤول:</label>
                <input type="text" id="employeeName" placeholder="اسم الموظف">
            </div>
            <div class="form-group">
                <label>🚚 طريقة الاستلام:</label>
                <div class="check-grid">
                    <div class="checkbox-box" onclick="selectDelivery(this, 'store')">
                        <input type="radio" name="delivery" class="no-print"> استلام بالمعرض
                    </div>
                    <div class="checkbox-box" onclick="selectDelivery(this, 'delivery')">
                        <input type="radio" name="delivery" class="no-print"> توصيل
                    </div>
                </div>
            </div>
        </div>

        <div class="section">💰 عملية الدفع</div>
        <div class="check-grid">
            <div class="checkbox-box" onclick="selectPayment(this, 'full')">
                <input type="radio" name="pay" class="no-print"> كامل المبلغ
            </div>
            <div class="checkbox-box" onclick="selectPayment(this, 'partial')">
                <input type="radio" name="pay" class="no-print"> جزء من المبلغ
            </div>
        </div>
        <div id="remBox" class="payment-row" style="display:none;">
            <label style="font-weight: bold;">المتبقي:</label>
            <input type="text" id="remainingAmount" placeholder="المبلغ المتبقي" style="width: 200px;">
        </div>

        <div class="signature-area">
            ✍️ توقيع العميل: ................................................
        </div>

        <button class="btn-print no-print" onclick="window.print()">🖨️ طباعة</button>
    </div>
</div>

<script>
    const weekDays = {
        'Sunday': 'الأحد', 'Monday': 'الاثنين', 'Tuesday': 'الثلاثاء',
        'Wednesday': 'الأربعاء', 'Thursday': 'الخميس', 'Friday': 'الجمعة', 'Saturday': 'السبت'
    };

    function getDayName(date) {
        const day = date.toLocaleDateString('en-US', { weekday: 'long' });
        return weekDays[day] || day;
    }

    function formatGregorianDateWithDay(date) {
        const day = date.getDate();
        const month = date.getMonth() + 1;
        const year = date.getFullYear();
        const dayStr = day < 10 ? '0' + day : day;
        const monthStr = month < 10 ? '0' + month : month;
        const dayName = getDayName(date);
        return `${dayName} - ${dayStr}/${monthStr}/${year}`;
    }

    // تاريخ اليوم
    const today = new Date();
    document.getElementById('todayDate').value = formatGregorianDateWithDay(today);

    // تاريخ الاستلام
    const deliveryPicker = document.getElementById('deliveryDatePicker');
    const deliveryDisplay = document.getElementById('deliveryDateDisplay');
    const todayStr = today.toISOString().split('T')[0];
    deliveryPicker.value = todayStr;
    deliveryDisplay.value = formatGregorianDateWithDay(today);
    
    deliveryPicker.addEventListener('change', function() {
        if (this.value) {
            const selectedDate = new Date(this.value);
            deliveryDisplay.value = formatGregorianDateWithDay(selectedDate);
        } else {
            deliveryDisplay.value = '';
        }
    });

    // باركود واتساب
    const phoneInput = document.getElementById('customerPhone');
    const waContainer = document.getElementById('waContainer');
    const waQR = document.getElementById('waQR');
    
    phoneInput.addEventListener('input', function() {
        let value = this.value.replace(/[^0-9]/g, '');
        this.value = value;
        
        if (value.length === 10 && value.startsWith('05')) {
            const internationalNumber = '966' + value.substring(1);
            const waLink = `https://wa.me/${internationalNumber}`;
            waQR.src = `https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${encodeURIComponent(waLink)}`;
            waContainer.style.display = 'block';
        } else {
            waContainer.style.display = 'none';
            waQR.src = '';
        }
    });

    // رفع الصور مع حذف
    function setupImageUpload(inputId, previewId) {
        const input = document.getElementById(inputId);
        const preview = document.getElementById(previewId);
        
        input.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'img-wrapper';
                    const img = document.createElement('img');
                    img.src = ev.target.result;
                    const deleteBtn = document.createElement('div');
                    deleteBtn.className = 'delete-img';
                    deleteBtn.innerHTML = '✕';
                    deleteBtn.onclick = () => wrapper.remove();
                    wrapper.appendChild(img);
                    wrapper.appendChild(deleteBtn);
                    preview.appendChild(wrapper);
                };
                reader.readAsDataURL(file);
            });
            input.value = '';
        });
    }
    
    setupImageUpload('trayUpload', 'trayPreview');
    setupImageUpload('itemsUpload', 'itemsPreview');

    // اختيارات الاستلام
    function selectDelivery(element, type) {
        const allBoxes = document.querySelectorAll('.check-grid .checkbox-box');
        allBoxes.forEach(box => {
            box.style.backgroundColor = 'white';
            box.style.color = 'black';
            const radio = box.querySelector('input');
            if (radio) radio.checked = false;
        });
        element.style.backgroundColor = '#e8f5e9';
        element.style.color = 'green';
        const radio = element.querySelector('input');
        if (radio) radio.checked = true;
    }

    // اختيارات الدفع
    function selectPayment(element, type) {
        const allBoxes = document.querySelectorAll('.check-grid .checkbox-box');
        allBoxes.forEach(box => {
            box.style.backgroundColor = 'white';
            box.style.color = 'black';
            const radio = box.querySelector('input');
            if (radio) radio.checked = false;
        });
        element.style.backgroundColor = '#e8f5e9';
        element.style.color = 'green';
        const radio = element.querySelector('input');
        if (radio) radio.checked = true;
        
        const remBox = document.getElementById('remBox');
        remBox.style.display = type === 'partial' ? 'flex' : 'none';
    }
</script>
</body>
</html>
