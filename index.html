<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>طلب عميل - باسقات الجزيرة</title>
    <style>
        /* إعادة تعيين كل الهوامش */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            background: #e0e0e0;
            font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* صفحة A4 */
        .page {
            max-width: 210mm;
            width: 100%;
            background: white;
            margin: 0 auto;
            padding: 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        /* المحتوى مع الهوامش الداخلية 0.5cm فقط */
        .page-content {
            padding: 0.5cm;
        }

        /* تنسيق الجدول الرئيسي */
        .main-table {
            width: 100%;
            border-collapse: collapse;
        }

        .main-table td, .main-table th {
            border: 1px solid #aaa;
            padding: 6px 8px;
            vertical-align: top;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #8B7D3C;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .logo-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo-img {
            max-width: 60px;
            max-height: 60px;
            object-fit: contain;
        }

        .header h2 {
            font-size: 18px;
            color: #2c2c2c;
            margin-top: 5px;
        }

        .employee-section {
            text-align: center;
            margin-top: 8px;
            margin-bottom: 10px;
        }

        .employee-section label {
            font-weight: bold;
            font-size: 12px;
            display: inline-block;
            margin-left: 8px;
        }

        .employee-section input {
            width: 200px;
            padding: 5px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font-size: 12px;
        }

        label {
            font-weight: bold;
            font-size: 11px;
            display: block;
            margin-bottom: 2px;
            color: #333;
        }

        input, textarea {
            padding: 5px;
            border: 1px solid #aaa;
            border-radius: 3px;
            font-size: 12px;
            font-family: inherit;
            width: 100%;
            box-sizing: border-box;
            background: white;
        }

        input[readonly] {
            background-color: #f9f9f9;
        }

        .date-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .date-wrapper input[type="text"] {
            width: 100%;
            padding-left: 30px;
        }

        .date-wrapper input[type="date"] {
            position: absolute;
            left: 0;
            top: 0;
            width: 30px;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .calendar-icon {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 12px;
        }

        .wa-box {
            display: none;
            text-align: center;
            margin-top: 5px;
            padding: 3px;
            background: #f5f5f5;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .wa-box span {
            font-size: 9px;
            font-weight: bold;
            display: block;
        }

        .wa-box img {
            width: 45px;
            height: 45px;
            margin: 2px auto;
        }

        .img-box {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            min-height: 70px;
            border: 1px dashed #aaa;
            padding: 6px;
            background: #fefefe;
        }

        .img-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 3px;
            border: 1px solid #ccc;
        }

        .delete-img {
            position: absolute;
            top: -5px;
            right: -5px;
            background: red;
            color: white;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
        }

        .check-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .checkbox-box {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .checkbox-box input {
            width: 14px;
            height: 14px;
            margin: 0;
        }

        .payment-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }

        .signature {
            margin-top: 15px;
            font-weight: bold;
            font-size: 12px;
        }

        .btn-print {
            width: 100%;
            padding: 8px;
            background: #555;
            color: white;
            border: none;
            margin-top: 15px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .page-content {
                padding: 0.4cm;
            }
            .img-wrapper {
                width: 65px;
                height: 65px;
            }
            .employee-section input {
                width: 160px;
            }
        }

        /* ================= إعدادات الطباعة النهائية ================= */
        @media print {
            /* إلغاء كل الهوامش تماماً */
            html, body {
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
            }
            
            .page {
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                max-width: 100% !important;
            }
            
            /* فقط هذه الهوامش الداخلية 0.5cm */
            .page-content {
                padding: 0.5cm !important;
                margin: 0 !important;
            }
            
            /* إخفاء العناصر غير المرغوب طباعتها */
            .no-print {
                display: none !important;
            }
            
            .delete-img {
                display: none !important;
            }
            
            .btn-print {
                display: none !important;
            }
            
            .date-wrapper input[type="date"] {
                display: none !important;
            }
            
            .calendar-icon {
                display: none !important;
            }
            
            /* إلغاء أي هوامش إضافية من المتصفح */
            @page {
                margin: 0 !important;
                size: A4 !important;
            }
        }
    </style>
</head>
<body>

<div class="page">
    <div class="page-content">
        <div class="header">
            <div class="logo-area">
                <img src="logo.png" alt="شعار الشركة" class="logo-img" onerror="this.style.display='none'">
            </div>
            <h2>طلبات العملاء</h2>
        </div>

        <div class="employee-section">
            <label>👨‍💼 الموظف المسؤول:</label>
            <input type="text" id="employeeName" placeholder="اسم الموظف">
        </div>

        <table class="main-table">
            <tr>
                <td style="width: 50%;">
                    <label>📅 تاريخ اليوم</label>
                    <input type="text" id="todayDate" readonly>
                </td>
                <td style="width: 50%;">
                    <label>📦 تاريخ الاستلام</label>
                    <div class="date-wrapper">
                        <input type="text" id="deliveryDateDisplay" readonly placeholder="اختر التاريخ">
                        <input type="date" id="deliveryDatePicker" class="no-print">
                        <span class="calendar-icon">📅</span>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <label>👤 اسم العميل</label>
                    <input type="text" id="customerName" placeholder="الاسم الكامل">
                </td>
                <td>
                    <label>📱 رقم العميل</label>
                    <input type="tel" id="customerPhone" maxlength="10" placeholder="05xxxxxxxx">
                    <div class="wa-box" id="waContainer">
                        <span>📱 باركود الواتس اب</span>
                        <img id="waQR" alt="QR Code">
                    </div>
                </td>
            </tr>
         </table>

        <div style="margin-top: 10px;">
            <label>🥘 صور الصواني</label>
            <input type="file" accept="image/*" id="trayUpload" class="no-print" capture="environment" multiple>
            <div class="img-box" id="trayPreview"></div>
        </div>

        <div style="margin-top: 10px;">
            <label>🍽️ صور الأصناف المختارة</label>
            <input type="file" accept="image/*" id="itemsUpload" class="no-print" capture="environment" multiple>
            <div class="img-box" id="itemsPreview"></div>
        </div>

        <div style="margin-top: 10px;">
            <label>📝 الأصناف المختارية كتابياً</label>
            <textarea rows="2" id="itemsText" placeholder="اكتب الأصناف المطلوبة..."></textarea>
        </div>

        <div style="margin-top: 8px;">
            <label>📌 ملاحظات</label>
            <textarea rows="2" id="notes" placeholder="أي ملاحظات إضافية..."></textarea>
        </div>

        <div style="margin-top: 10px;">
            <label>🚚 طريقة الاستلام</label>
            <div class="check-group">
                <label class="checkbox-box" onclick="selectDelivery(this, 'store')">
                    <input type="radio" name="delivery" class="no-print"> استلام بالمعرض
                </label>
                <label class="checkbox-box" onclick="selectDelivery(this, 'delivery')">
                    <input type="radio" name="delivery" class="no-print"> توصيل
                </label>
            </div>
        </div>

        <div style="margin-top: 10px;">
            <label>💰 عملية الدفع</label>
            <div class="check-group">
                <label class="checkbox-box" onclick="selectPayment(this, 'full')">
                    <input type="radio" name="pay" class="no-print"> كامل المبلغ
                </label>
                <label class="checkbox-box" onclick="selectPayment(this, 'partial')">
                    <input type="radio" name="pay" class="no-print"> جزء من المبلغ
                </label>
            </div>
            <div id="remBox" class="payment-row" style="display:none;">
                <label style="font-weight: bold;">المتبقي:</label>
                <input type="text" id="remainingAmount" placeholder="المبلغ المتبقي" style="width: 180px;">
            </div>
        </div>

        <div class="signature">
            ✍️ توقيع العميل: ................................................................
        </div>

        <button class="btn-print no-print" onclick="window.print()">🖨️ طباعة</button>
    </div>
</div>

<script>
    const weekDays = {
        'Sunday': 'الأحد', 'Monday': 'الاثنين', 'Tuesday': 'الثلاثاء',
        'Wednesday': 'الأربعاء', 'Thursday': 'الخميس', 'Friday': 'الجمعة', 'Saturday': 'السبت'
    };

    function getDayName(date) {
        const day = date.toLocaleDateString('en-US', { weekday: 'long' });
        return weekDays[day] || day;
    }

    function formatDateWithDay(date) {
        const day = date.getDate();
        const month = date.getMonth() + 1;
        const year = date.getFullYear();
        const dayStr = day < 10 ? '0' + day : day;
        const monthStr = month < 10 ? '0' + month : month;
        const dayName = getDayName(date);
        return `${dayName} - ${dayStr}/${monthStr}/${year}`;
    }

    const today = new Date();
    document.getElementById('todayDate').value = formatDateWithDay(today);

    const deliveryPicker = document.getElementById('deliveryDatePicker');
    const deliveryDisplay = document.getElementById('deliveryDateDisplay');
    const todayStr = today.toISOString().split('T')[0];
    deliveryPicker.value = todayStr;
    deliveryDisplay.value = formatDateWithDay(today);
    
    deliveryPicker.addEventListener('change', function() {
        if (this.value) {
            const selectedDate = new Date(this.value);
            deliveryDisplay.value = formatDateWithDay(selectedDate);
        }
    });

    const phoneInput = document.getElementById('customerPhone');
    const waContainer = document.getElementById('waContainer');
    const waQR = document.getElementById('waQR');
    
    phoneInput.addEventListener('input', function() {
        let value = this.value.replace(/[^0-9]/g, '');
        this.value = value;
        
        if (value.length === 10 && value.startsWith('05')) {
            const internationalNumber = '966' + value.substring(1);
            const waLink = `https://wa.me/${internationalNumber}`;
            waQR.src = `https://api.qrserver.com/v1/create-qr-code/?size=70x70&data=${encodeURIComponent(waLink)}`;
            waContainer.style.display = 'block';
        } else {
            waContainer.style.display = 'none';
            waQR.src = '';
        }
    });

    function setupImageUpload(inputId, previewId) {
        const input = document.getElementById(inputId);
        const preview = document.getElementById(previewId);
        
        input.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'img-wrapper';
                    const img = document.createElement('img');
                    img.src = ev.target.result;
                    const deleteBtn = document.createElement('div');
                    deleteBtn.className = 'delete-img';
                    deleteBtn.innerHTML = '✕';
                    deleteBtn.onclick = () => wrapper.remove();
                    wrapper.appendChild(img);
                    wrapper.appendChild(deleteBtn);
                    preview.appendChild(wrapper);
                };
                reader.readAsDataURL(file);
            });
            input.value = '';
        });
    }
    
    setupImageUpload('trayUpload', 'trayPreview');
    setupImageUpload('itemsUpload', 'itemsPreview');

    document.addEventListener('DOMContentLoaded', function() {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const cameraInputs = document.querySelectorAll('input[type="file"][capture]');
        
        cameraInputs.forEach(function(input) {
            if (!isIOS) {
                input.setAttribute('capture', 'environment');
            }
        });
    });

    function selectDelivery(element, type) {
        const radios = document.querySelectorAll('.checkbox-box input[name="delivery"]');
        radios.forEach(radio => radio.checked = false);
        const radio = element.querySelector('input');
        if (radio) radio.checked = true;
    }

    function selectPayment(element, type) {
        const radios = document.querySelectorAll('.checkbox-box input[name="pay"]');
        radios.forEach(radio => radio.checked = false);
        const radio = element.querySelector('input');
        if (radio) radio.checked = true;
        
        const remBox = document.getElementById('remBox');
        remBox.style.display = type === 'partial' ? 'flex' : 'none';
    }
</script>
</body>
</html>
