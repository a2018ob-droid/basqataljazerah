<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>طباعة الملصقات</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #eee; }
        .product-card { background: white; padding: 15px; margin-bottom: 20px; border: 1px solid #000; width: 330px; }
        
        /* تصميم ثابت لا يتداخل أبداً */
        .box { 
            width: 300px; 
            font-family: 'Courier New', Courier, monospace; 
            font-weight: 900;
            font-size: 18px; 
            line-height: 2; 
            text-align: right;
            border: 2px dashed #000;
            padding: 10px;
        }

        @media print {
            body * { visibility: hidden; }
            .box, .box * { visibility: visible !important; }
            .box { position: absolute; left: 0; top: 0; border: none; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <div id="container"></div>

    <script>
        const items = [
            { id: 1, title: "3 شهور", m: 3 },
            { id: 2, title: "6 شهور", m: 6 },
            { id: 3, title: "سنة", m: 12 },
            { id: 4, title: "سنتين", m: 24 }
        ];

        function init() {
            const container = document.getElementById('container');
            const today = new Date();
            
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <h3>${item.title}</h3>
                    <div class="box" id="box-${item.id}">
                        السعر: <span id="price-${item.id}">19</span> ريــال<br>
                        P: <span id="p-${item.id}"></span><br>
                        E: <span id="e-${item.id}"></span>
                    </div>
                    <div class="no-print" style="margin-top:10px;">
                        سعر: <input type="number" id="inp-price-${item.id}" value="19" style="width:50px;"><br>
                        إنتاج: <input type="date" id="inp-date-${item.id}" onchange="calc(${item.id}, ${item.m})">
                    </div>
                    <button class="no-print" onclick="printBox(${item.id})">طباعة</button>
                `;
                container.appendChild(card);
                document.getElementById(`inp-date-${item.id}`).valueAsDate = today;
                calc(item.id, item.m);
            });
        }

        function calc(id, m) {
            const pVal = document.getElementById(`inp-date-${id}`).value;
            const pDate = new Date(pVal);
            const eDate = new Date(pDate);
            eDate.setMonth(eDate.getMonth() + m);
            
            document.getElementById(`p-${id}`).innerText = formatDate(pDate);
            document.getElementById(`e-${id}`).innerText = formatDate(eDate);
        }

        function formatDate(d) {
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }

        function printBox(id) {
            document.getElementById(`price-${id}`).innerText = document.getElementById(`inp-price-${id}`).value;
            window.print();
        }

        window.onload = init;
    </script>
</body>
</html>
