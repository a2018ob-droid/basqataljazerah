<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب العميل</title>
    <style>
        @page { size: A4; margin: 0.3in; }
        body { font-family: sans-serif; background: #eee; margin: 0; padding: 10px; display: flex; justify-content: center; }
        
        .page { 
            width: 100%; 
            max-width: 190mm; 
            background: #fff; 
            padding: 10px; 
            box-sizing: border-box; 
            border: 1px solid #ccc;
            min-height: 270mm;
            overflow: hidden;
        }
        
        .header { text-align: center; border-bottom: 2px solid #8c7b5a; padding-bottom: 5px; margin-bottom: 10px; }
        .header img { max-width: 80px; display: block; margin: 0 auto 5px; }
        .header h2 { margin: 0; font-size: 18px; }

        .grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 8px; }
        @media (min-width: 400px) { .grid { grid-template-columns: 1fr 1fr; } }
        
        label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 2px; }
        input, textarea { padding: 8px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; font-size: 14px; border-radius: 5px; }
        
        .invalid { border-color: red !important; background-color: #fff6f6; }
        .valid { border-color: green !important; }

        .section { font-weight: bold; background: #f9f9f9; padding: 6px; border-right: 4px solid #8c7b5a; margin: 8px 0; font-size: 13px; }
        
        .photo-area { display: flex; flex-wrap: wrap; gap: 5px; min-height: 60px; border: 1px dashed #ccc; padding: 5px; }
        .img-wrapper { position: relative; width: 60px; height: 60px; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
        .del-btn { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 12px; text-align: center; line-height: 16px; cursor: pointer; font-weight: bold; }
        
        .check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-opt { padding: 10px; border: 1px solid #ccc; text-align: center; cursor: pointer; font-weight: bold; font-size: 12px; border-radius: 5px; }
        
        /* تنسيق مربع باركود الواتساب */
        .wa-box { display: none; text-align: center; margin-top: 5px; border: 1px dashed #25D366; padding: 5px; border-radius: 5px; background: #f0fff4; }
        .wa-box span { font-size: 11px; font-weight: bold; color: #25D366; display: block; margin-bottom: 3px; }
        .wa-box img { width: 50px; height: 50px; display: block; margin: 0 auto; }

        /* -- إعدادات الطباعة -- */
        @media print { 
            @page { size: A4 portrait; margin: 0; } 
            
            body { margin: 0; padding: 0; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print, .del-btn { display: none !important; } 
            
            .page { 
                border: none; 
                margin: 0; 
                padding: 10mm; 
                height: 297mm; 
                max-height: 297mm;
                max-width: 100%; 
                box-shadow: none; 
                overflow: hidden; 
                page-break-after: avoid; 
                page-break-inside: avoid;
            }

            .header { margin-bottom: 5px; padding-bottom: 5px; }
            .section { margin: 5px 0; padding: 4px; font-size: 12px; }
            .grid { gap: 6px; margin-bottom: 6px; }
            input, textarea { padding: 6px; }
            .photo-area { min-height: 50px; }
            /* إظهار باركود الواتساب بوضوح عند الطباعة */
            .wa-box { background: transparent; border-color: #000; }
            .wa-box span { color: #000; }
        }
    </style>
</head>
<body>

<div class="page">
    <div class="header">
        <img src="logo.png" alt="شعار المتجر" onerror="this.style.display='none'">
        <h2>طلب العميل</h2>
    </div>

    <div class="grid">
        <div class="form-group"><label>تاريخ اليوم:</label><input type="text" id="today" readonly></div>
        
        <div class="form-group"><label>تاريخ الاستلام:</label>
            <div style="position: relative;">
                <input type="text" id="delivery-date-display" placeholder="اختر التاريخ..." readonly>
                <input type="date" class="no-print" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer;" onchange="updateDeliveryDate(this.value)">
            </div>
        </div>

        <div class="form-group"><label>اسم العميل:</label><input type="text"></div>
        <div class="form-group">
            <label>الجوال:</label>
            <input type="tel" id="phone" maxlength="10" placeholder="05xxxxxxxx" oninput="validatePhone(this)">
            
            <div class="wa-box" id="wa-container">
                <span>📱 واتساب العميل</span>
                <img id="wa-qr" src="" alt="QR">
            </div>
        </div>
    </div>

    <div class="section">الصواني</div>
    <input type="file" accept="image/*" class="no-print camera-input" onchange="readImage(this, 'tray-box')">
    <div class="photo-area" id="tray-box"></div>

    <div class="section">الأصناف (صور)</div>
    <input type="file" accept="image/*" class="no-print camera-input" onchange="readImage(this, 'item-box')">
    <div class="photo-area" id="item-box"></div>

    <div class="section">الأصناف (كتابياً)</div>
    <textarea rows="2"></textarea>

    <div class="section">الملاحظات</div>
    <textarea rows="2"></textarea>

    <div class="grid">
        <div class="form-group"><label>الموظف المسؤول:</label><input type="text"></div>
        <div class="form-group"><label>طريقة الاستلام:</label>
            <div class="check-grid">
                <div class="btn-opt" id="d1" onclick="toggle('d1', 'd2', '#e8f5e9', 'green')">استلام بالمعرض</div>
                <div class="btn-opt" id="d2" onclick="toggle('d2', 'd1', '#ffebee', 'red')">توصيل</div>
            </div>
        </div>
    </div>

    <div class="section">عملية الدفع</div>
    <div class="check-grid">
        <div class="btn-opt" id="p1" onclick="toggle('p1', 'p2', '#e8f5e9', 'green'); document.getElementById('rem').style.display='none'">كامل المبلغ</div>
        <div class="btn-opt" id="p2" onclick="toggle('p2', 'p1', '#ffebee', 'red'); document.getElementById('rem').style.display='block'">جزء من المبلغ</div>
    </div>
    <div id="rem" style="display:none; margin-top:5px;"><input type="text" placeholder="المتبقي..."></div>

    <div style="margin-top:15px; border-top: 1px solid #000; padding-top:5px; font-size: 13px;">
        توقيع العميل: ................................................
    </div>
    <button class="no-print" style="width:100%; padding:12px; margin-top:10px; background:#8c7b5a; color:#fff; border:none; cursor:pointer; border-radius:5px;" onclick="window.print()">طباعة النموذج</button>
</div>

<script>
    function formatDate(date) {
        const days = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        let dayName = days[date.getDay()];
        let d = String(date.getDate()).padStart(2, '0');
        let m = String(date.getMonth() + 1).padStart(2, '0');
        let y = date.getFullYear();
        return `${dayName} - ${d}/${m}/${y}`;
    }

    document.getElementById('today').value = formatDate(new Date());

    function validatePhone(input) {
        // السماح بالأرقام فقط
        input.value = input.value.replace(/[^0-9]/g, '');
        
        const waContainer = document.getElementById('wa-container');
        const waQr = document.getElementById('wa-qr');

        // التحقق إذا كان الرقم 10 خانات ويبدأ بـ 05
        if (input.value.length === 10 && input.value.startsWith('05')) {
            input.classList.remove('invalid');
            input.classList.add('valid');
            
            // تحويل الرقم إلى الصيغة الدولية للواتساب (السعودية 966)
            let internationalNumber = '966' + input.value.substring(1);
            let waLink = `https://wa.me/${internationalNumber}`;
            
            // توليد الباركود وعرض المربع
            waQr.src = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(waLink)}`;
            waContainer.style.display = 'block';
        } else {
            input.classList.remove('valid');
            input.classList.add('invalid');
            waContainer.style.display = 'none';
            waQr.src = '';
        }
    }

    function updateDeliveryDate(val) {
        if (!val) return;
        const [year, month, day] = val.split('-');
        const dateObj = new Date(year, month - 1, day);
        document.getElementById('delivery-date-display').value = formatDate(dateObj);
    }

    function readImage(input, containerId) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const wrapper = document.createElement('div');
                wrapper.className = 'img-wrapper';
                const img = document.createElement('img');
                img.src = e.target.result;
                const delBtn = document.createElement('div');
                delBtn.className = 'del-btn';
                delBtn.innerHTML = '×';
                delBtn.onclick = function() { 
                    wrapper.remove(); 
                    input.value = ''; 
                };
                wrapper.appendChild(img);
                wrapper.appendChild(delBtn);
                document.getElementById(containerId).appendChild(wrapper);
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function toggle(sId, oId, color, border) {
        document.getElementById(sId).style.backgroundColor = color;
        document.getElementById(sId).style.borderColor = border;
        document.getElementById(oId).style.backgroundColor = 'transparent';
        document.getElementById(oId).style.borderColor = '#ccc';
    }

    document.addEventListener("DOMContentLoaded", function() {
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var cameraInputs = document.querySelectorAll('.camera-input');
        
        cameraInputs.forEach(function(input) {
            if (!isIOS) {
                input.setAttribute('capture', 'environment');
            } else {
                input.removeAttribute('capture');
            }
        });
    });
</script>
</body>
</html>
